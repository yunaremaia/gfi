[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gfi"
version = "0.1.0"
description = "Good First Issue finder — search and filter GitHub issues for contributors"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Yunaremaia", email = "yunare@gmail.com"}]
keywords = ["github", "open-source", "good-first-issue", "contributors", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "click>=8.1",
    "rich>=13.0",
]

[project.optional-dependencies]
# ruff is pinned to an exact version so the lint gate reports the same findings
# locally and in CI. A floating range lets a new ruff release change the rule
# behaviour under us, which turns a lint gate red without any code change.
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff==0.16.10"]

[project.scripts]
gfi = "gfi.cli:cli"
gh-gfi = "gfi.gh_extension:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
# E  pycodestyle errors (incl. E501 line length)
# F  pyflakes (dead code, undefined names, unused imports)
# I  isort (import order/formatting)
# UP pyupgrade (modern syntax for the declared Python floor)
# B  flake8-bugbear (likely-bug patterns)
#
# This is the real lint gate enforced by the `lint` job in CI. Fix the code --
# never silence a whole file with a blanket `# ruff: noqa`.
select = ["E", "F", "I", "UP", "B"]

[tool.coverage.report]
# Enforced gate: `pytest --cov=gfi` fails the run (non-zero exit) when the
# measured total is below this number, instead of only printing a number.
#
# MEASURED BASELINE: 78.75% (341/433 statements), 109 tests passing.
#
# WHY THE FLOOR IS floor(78.75) = 78, NOT 79
#
# There are two different fail_under comparisons in play, and they do NOT
# round the same way:
#
#   1. coverage.py -- coverage/results.py:should_fail_under()
#          return round(total, precision) < fail_under
#      Rounds first. An 78.75% total rounds to 79, so `79 < 79` is False
#      and a gate of 79 would pass.
#
#   2. pytest-cov -- pytest_cov/plugin.py, pytest_terminal_summary()
#          failed = self.cov_total < self.options.cov_fail_under
#      NO rounding. 78.75 < 79 is True, so a gate of 79 FAILS.
#
# CI runs `pytest --cov=gfi`, so check #2 is the one that actually decides the
# run. The rounding argument in #1 does not apply here: a floor set to
# round(measured) was measured to fail CI on this tree.
#
# So: set the floor to floor(the measured percentage), never round() it up.
#
# (The 66.04% / 282-of-427 figure this file used to record was stale: it predates
# #68, #70, #72 and #73. The old floor of 60 therefore sat ~19 points under the
# real baseline and could not have failed on a real regression.)
#
# Raise this number as coverage genuinely improves. Never lower it to make CI
# green -- add a test instead.
fail_under = 78

