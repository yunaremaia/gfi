[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gfi"
version = "0.1.0"
description = "Good First Issue finder — search and filter GitHub issues for contributors"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Yunaremaia", email = "yunare@gmail.com"}]
keywords = ["github", "open-source", "good-first-issue", "contributors", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "click>=8.1",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[project.scripts]
gfi = "gfi.cli:cli"
gh-gfi = "gfi.gh_extension:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.report]
# Enforced gate: `pytest --cov=gfi` now fails the run (non-zero exit) when the
# measured total drops below this number, instead of only printing a number.
#
# Measured baseline on origin/main: 66.04% (282/427 statements).
# coverage compares `round(total, 0) < fail_under`, so the baseline rounds to 66.
# A gate of 66 would sit ~0.04 points below the real total and break CI after a
# couple of uncovered statements, so the floor is set to 60: it keeps ~6 points
# of headroom (about 26 statements) and still catches real regressions.
#
# Raise this number as the suite grows -- never silently lower it to make CI green.
fail_under = 60
